<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Solar Agent Data Structure</title>
  <desc id="desc">A simple presentation diagram showing company-owned users, solar plant data, financial data, and agent outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="dashArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; }
      .groupTitle { font: 700 21px Inter, Arial, sans-serif; fill: #1e293b; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .company { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; rx: 20; }
      .users { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; rx: 18; }
      .plant { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; rx: 18; }
      .finance { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; rx: 18; }
      .output { fill: #fce7f3; stroke: #db2777; stroke-width: 2.5; rx: 18; }
      .label { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .noteTitle { font: 700 16px Inter, Arial, sans-serif; fill: #334155; }
      .noteText { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#dashArrow); }
      .arrowLabel { font: 600 13px Inter, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="80" y="68">Data Structure: Solar Plant Agent Demo</text>
  <text class="subtitle" x="80" y="100">Every record is owned by a company, and user access decides what data can be seen.</text>

  <!-- Main ownership boxes -->
  <rect class="company" x="80" y="210" width="250" height="130"/>
  <text class="label" x="205" y="260" text-anchor="middle">Company</text>
  <text class="small" x="205" y="288" text-anchor="middle">Tenant / customer account</text>
  <text class="small" x="205" y="312" text-anchor="middle">Example: company_1</text>

  <rect class="users" x="80" y="430" width="250" height="125"/>
  <text class="label" x="205" y="478" text-anchor="middle">Users</text>
  <text class="small" x="205" y="506" text-anchor="middle">Role + access level</text>
  <text class="small" x="205" y="530" text-anchor="middle">Energy-only or financial</text>

  <!-- Solar Plant Data group -->
  <rect class="group" x="410" y="150" width="710" height="245"/>
  <text class="groupTitle" x="440" y="188">Solar Plant Data</text>

  <rect class="plant" x="440" y="225" width="145" height="105"/>
  <text class="label" x="512" y="266" text-anchor="middle">Plants</text>
  <text class="small" x="512" y="292" text-anchor="middle">Solar sites</text>

  <rect class="plant" x="625" y="225" width="155" height="105"/>
  <text class="label" x="702" y="266" text-anchor="middle">Equipment</text>
  <text class="small" x="702" y="292" text-anchor="middle">Meters, sensors</text>

  <rect class="plant" x="820" y="225" width="145" height="105"/>
  <text class="label" x="892" y="266" text-anchor="middle">Data Sources</text>
  <text class="small" x="892" y="292" text-anchor="middle">Named metrics</text>

  <rect class="plant" x="1000" y="225" width="95" height="105"/>
  <text class="label" x="1047" y="266" text-anchor="middle">Readings</text>
  <text class="small" x="1047" y="292" text-anchor="middle">Time values</text>

  <!-- Financial group -->
  <rect class="group" x="410" y="455" width="410" height="230"/>
  <text class="groupTitle" x="440" y="493">Financial Data</text>

  <rect class="finance" x="450" y="535" width="150" height="105"/>
  <text class="label" x="525" y="576" text-anchor="middle">Market Prices</text>
  <text class="small" x="525" y="602" text-anchor="middle">Price by time</text>

  <rect class="finance" x="640" y="535" width="145" height="105"/>
  <text class="label" x="712" y="576" text-anchor="middle">Monthly Costs</text>
  <text class="small" x="712" y="602" text-anchor="middle">Plant costs</text>

  <!-- Outputs group -->
  <rect class="group" x="910" y="455" width="360" height="230"/>
  <text class="groupTitle" x="940" y="493">Agent Outputs</text>

  <rect class="output" x="950" y="535" width="130" height="105"/>
  <text class="label" x="1015" y="576" text-anchor="middle">Runs</text>
  <text class="small" x="1015" y="602" text-anchor="middle">Saved chat/report</text>

  <rect class="output" x="1120" y="535" width="115" height="105"/>
  <text class="label" x="1177" y="576" text-anchor="middle">Reports</text>
  <text class="small" x="1177" y="602" text-anchor="middle">PDF, XLSX, DOCX</text>

  <!-- arrows -->
  <path class="arrow" d="M330 275 L430 275"/>
  <text class="arrowLabel" x="345" y="260">owns</text>

  <path class="arrow" d="M585 277 L615 277"/>
  <path class="arrow" d="M780 277 L810 277"/>
  <path class="arrow" d="M965 277 L990 277"/>

  <path class="arrow" d="M330 285 C365 285 365 587 440 587"/>
  <text class="arrowLabel" x="348" y="455">company-scoped</text>

  <path class="arrow" d="M585 330 C585 420 712 420 712 525"/>
  <text class="arrowLabel" x="623" y="430">costs link to plants</text>

  <path class="arrow" d="M330 492 L940 587"/>
  <text class="arrowLabel" x="520" y="520">user action creates run</text>

  <path class="arrow" d="M1080 587 L1110 587"/>

  <path class="dash" d="M330 492 C380 492 380 475 450 475"/>
  <text class="arrowLabel" x="305" y="625">role controls financial access</text>

  <path class="dash" d="M205 340 L205 420"/>
  <text class="arrowLabel" x="225" y="383">users belong here</text>

  <path class="dash" d="M330 310 C370 360 370 455 410 520"/>
  <path class="dash" d="M330 320 C400 410 840 400 925 520"/>

  <!-- Callouts -->
  <rect class="box" x="1290" y="175" width="230" height="105"/>
  <text class="noteTitle" x="1315" y="215">Key idea 1</text>
  <text class="noteText" x="1315" y="242">Company is the boundary.</text>
  <text class="noteText" x="1315" y="264">Data is not mixed across tenants.</text>

  <rect class="box" x="1290" y="320" width="230" height="120"/>
  <text class="noteTitle" x="1315" y="360">Key idea 2</text>
  <text class="noteText" x="1315" y="387">Energy-only users cannot see</text>
  <text class="noteText" x="1315" y="409">prices, costs, revenue, or profit.</text>

  <rect class="box" x="1290" y="480" width="230" height="120"/>
  <text class="noteTitle" x="1315" y="520">Key idea 3</text>
  <text class="noteText" x="1315" y="547">Reports are owned by the</text>
  <text class="noteText" x="1315" y="569">company, user, and run.</text>

  <rect class="box" x="1290" y="640" width="230" height="105"/>
  <text class="noteTitle" x="1315" y="680">Key idea 4</text>
  <text class="noteText" x="1315" y="707">The AI uses services.</text>
  <text class="noteText" x="1315" y="729">It does not query raw tables.</text>

  <!-- Footer -->
  <text class="small" x="80" y="825">Simple reading path: Company → Plant → Equipment → Data Source → Reading</text>
  <text class="small" x="80" y="850">Simple report path: User → Run → Generated Report, with ownership checks on download</text>
</svg>
