<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Simple Database Structure</title>
  <desc id="desc">A simple data structure diagram showing the database records and their relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.2; rx: 18; }
      .company { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; rx: 20; }
      .energy { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.4; rx: 18; }
      .finance { fill: #fef3c7; stroke: #d97706; stroke-width: 2.4; rx: 18; }
      .output { fill: #fce7f3; stroke: #db2777; stroke-width: 2.4; rx: 18; }
      .text { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .label { font: 600 13px Inter, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="850"/>
  <text class="title" x="70" y="70">Simple Database Structure</text>
  <text class="subtitle" x="70" y="102">What we store in SQLite and how the records connect.</text>

  <!-- top row -->
  <rect class="company" x="570" y="145" width="260" height="110"/>
  <text class="text" x="700" y="190" text-anchor="middle">Companies</text>
  <text class="small" x="700" y="218" text-anchor="middle">Each customer / tenant</text>

  <!-- second row -->
  <rect class="box" x="110" y="330" width="220" height="95"/>
  <text class="text" x="220" y="370" text-anchor="middle">Users</text>
  <text class="small" x="220" y="397" text-anchor="middle">Role + access level</text>

  <rect class="energy" x="470" y="330" width="220" height="95"/>
  <text class="text" x="580" y="370" text-anchor="middle">Plants</text>
  <text class="small" x="580" y="397" text-anchor="middle">Solar sites</text>

  <rect class="finance" x="820" y="330" width="220" height="95"/>
  <text class="text" x="930" y="370" text-anchor="middle">Market Prices</text>
  <text class="small" x="930" y="397" text-anchor="middle">Financial data</text>

  <rect class="output" x="1080" y="330" width="220" height="95"/>
  <text class="text" x="1190" y="370" text-anchor="middle">Runs</text>
  <text class="small" x="1190" y="397" text-anchor="middle">Saved chat/report actions</text>

  <!-- plant chain -->
  <rect class="energy" x="360" y="535" width="200" height="95"/>
  <text class="text" x="460" y="575" text-anchor="middle">Elements</text>
  <text class="small" x="460" y="602" text-anchor="middle">Meters, sensors, devices</text>

  <rect class="energy" x="620" y="535" width="200" height="95"/>
  <text class="text" x="720" y="575" text-anchor="middle">Data Sources</text>
  <text class="small" x="720" y="602" text-anchor="middle">Named measurements</text>

  <rect class="energy" x="880" y="535" width="200" height="95"/>
  <text class="text" x="980" y="575" text-anchor="middle">Readings</text>
  <text class="small" x="980" y="602" text-anchor="middle">Timestamp + value</text>

  <rect class="finance" x="110" y="535" width="200" height="95"/>
  <text class="text" x="210" y="575" text-anchor="middle">Monthly Costs</text>
  <text class="small" x="210" y="602" text-anchor="middle">Financial data by plant</text>

  <rect class="output" x="1130" y="535" width="220" height="95"/>
  <text class="text" x="1240" y="575" text-anchor="middle">Generated Documents</text>
  <text class="small" x="1240" y="602" text-anchor="middle">PDF, Excel, Word reports</text>

  <!-- arrows from companies -->
  <path class="arrow" d="M620 255 C500 285 330 285 240 322"/>
  <text class="label" x="390" y="295">owns</text>

  <path class="arrow" d="M680 255 C660 292 620 300 592 322"/>
  <text class="label" x="630" y="295">owns</text>

  <path class="arrow" d="M745 255 C790 295 875 300 915 322"/>
  <text class="label" x="820" y="295">owns</text>

  <path class="arrow" d="M805 255 C930 290 1110 292 1172 322"/>
  <text class="label" x="1010" y="295">owns</text>

  <!-- plant chain arrows -->
  <path class="arrow" d="M542 425 C510 465 480 485 465 525"/>
  <text class="label" x="498" y="486">has</text>

  <path class="arrow" d="M560 582 L610 582"/>
  <text class="label" x="573" y="565">has</text>

  <path class="arrow" d="M820 582 L870 582"/>
  <text class="label" x="833" y="565">has</text>

  <!-- costs tied to plants -->
  <path class="arrow" d="M470 387 C350 435 270 470 225 525"/>
  <text class="label" x="310" y="450">has costs</text>

  <!-- runs/docs -->
  <path class="arrow" d="M1190 425 L1232 525"/>
  <text class="label" x="1220" y="480">creates</text>

  <path class="arrow" d="M330 378 L1070 378"/>
  <text class="label" x="650" y="360">users create runs</text>

  <!-- bottom explanation -->
  <rect class="box" x="110" y="705" width="1180" height="80"/>
  <text class="small" x="140" y="738">Core hierarchy: Company → Plant → Element → Data Source → Reading</text>
  <text class="small" x="140" y="765">Financial hierarchy: Company/Plant → Market Prices + Monthly Costs. Output hierarchy: User → Run → Generated Document.</text>
</svg>
